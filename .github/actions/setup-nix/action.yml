name: Setup Nix
description: Set up Nix with Cachix
inputs:
  cachixAuthToken:
    description: Auth token for pushing to Cachix binary cache
    required: false
  skipPush:
    description: Whether to skip pushing store paths to Cachix
    required: false
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        extra_nix_config: |
          # install-nix-action already marks the runner as a trusted user, but
          # nix still drops flake-declared caches ("ignoring untrusted flake
          # configuration") unless we opt in. Accept them so cache.numtide.com
          # (declared in our flake nixConfig) is actually used; otherwise its
          # only-on-numtide outputs (e.g. agent-browser) are built from source
          # and OOM-kill the macOS runner on the dashboard pnpm deps.
          accept-flake-config = true
          extra-substituters = https://cache.numtide.com
          extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
    - name: Setup cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: kazukit
        authToken: ${{ inputs.cachixAuthToken }}
        skipPush: ${{ inputs.skipPush }}
        extraPullNames: "nix-community"
