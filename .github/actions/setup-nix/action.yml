name: Setup Nix
description: Set up Nix with Cachix
inputs:
  cachixAuthToken:
    description: Auth token for pushing to Cachix binary cache
    required: false
  skipPush:
    description: Whether to skip pushing store paths to Cachix
    required: false
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
      with:
        extra_nix_config: |
          extra-substituters = https://cache.numtide.com
          extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
    - name: Setup cachix
      uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
      with:
        name: kazukit
        authToken: ${{ inputs.cachixAuthToken }}
        skipPush: ${{ inputs.skipPush }}
        extraPullNames: "nix-community"
