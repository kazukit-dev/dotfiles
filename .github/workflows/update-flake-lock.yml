name: Update flake.lock (weekly)
on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC (09:00 JST)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-flake-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          cachixAuthToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - uses: ./.github/actions/update-flake-lock
        with:
          github-token: ${{ github.token }}
          pr-app-id: ${{ vars.PULL_REQUEST_APP_ID }}
          pr-app-private-key: ${{ secrets.PULL_REQUEST_APP_PRIVATE_KEY }}
          auto-merge: "true"
