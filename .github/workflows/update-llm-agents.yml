name: Update llm-agents (daily)
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-flake-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          cachixAuthToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - uses: ./.github/actions/update-flake-lock
        with:
          targets: llm-agents
          github-token: ${{ github.token }}
          pr-app-id: ${{ vars.PULL_REQUEST_APP_ID }}
          pr-app-private-key: ${{ secrets.PULL_REQUEST_APP_PRIVATE_KEY }}
          auto-merge: "true"
