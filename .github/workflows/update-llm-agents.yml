name: Update llm-agents (daily)
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup-nix
        with:
          cachixAuthToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - uses: ./.github/actions/update-flake
        with:
          input: llm-agents
          min-release-days: "0"
          pr-app-id: ${{ vars.PULL_REQUEST_APP_ID }}
          pr-app-private-key: ${{ secrets.PULL_REQUEST_APP_PRIVATE_KEY }}
          auto-merge: "true"
