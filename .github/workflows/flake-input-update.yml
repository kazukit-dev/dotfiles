name: Update flake input
on:
  schedule:
    - cron: "0 18 * * *" # JST 3:00
  workflow_dispatch:
    inputs:
      target:
        description: Flake input to update
        required: true
        default: claude-code-overlay
        type: choice
        options:
          - claude-code-overlay
permissions:
  contents: read
jobs:
  update-flake-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          cachixAuthToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Determine inputs to update
        id: targets
        run: |
          ALL_INPUTS="claude-code-overlay"
          TARGET="${{ github.event.inputs.target || 'all' }}"
          if [ "$TARGET" = "all" ]; then
            echo "inputs=$ALL_INPUTS" >> "$GITHUB_OUTPUT"
          else
            echo "inputs=$TARGET" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          get_locked_info() {
            local input="$1"
            local node_name
            node_name=$(jq -r ".nodes.root.inputs[\"$input\"]" flake.lock)
            local owner repo rev ref
            owner=$(jq -r ".nodes[\"$node_name\"].locked.owner" flake.lock)
            repo=$(jq -r ".nodes[\"$node_name\"].locked.repo" flake.lock)
            rev=$(jq -r ".nodes[\"$node_name\"].locked.rev" flake.lock)
            ref=$(jq -r ".nodes[\"$node_name\"].original.ref // empty" flake.lock)
            echo "$owner $repo $rev $ref"
          }

          NEEDS_UPDATE=""

          for input in ${{ steps.targets.outputs.inputs }}; do
            read -r owner repo locked_rev ref <<< "$(get_locked_info "$input")"
            target_ref="${ref:-HEAD}"
            latest_rev=$(gh api "repos/$owner/$repo/commits/$target_ref" --jq '.sha')

            if [ "$locked_rev" != "$latest_rev" ]; then
              echo "$input: $locked_rev -> $latest_rev"
              NEEDS_UPDATE="${NEEDS_UPDATE:+$NEEDS_UPDATE }$input"
            else
              echo "$input: up to date ($locked_rev)"
            fi
          done

          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"
      - name: Update inputs
        if: steps.check.outputs.needs_update != ''
        id: update
        run: |
          get_rev() {
            local input="$1"
            local node_name
            node_name=$(jq -r ".nodes.root.inputs[\"$input\"]" flake.lock)
            jq -r ".nodes[\"$node_name\"].locked.rev" flake.lock
          }

          SUMMARY=""

          for input in ${{ steps.check.outputs.needs_update }}; do
            old_rev=$(get_rev "$input")
            nix flake update "$input"
            new_rev=$(get_rev "$input")
            SUMMARY="${SUMMARY}- **${input}**: \`${old_rev:0:7}\` → \`${new_rev:0:7}\`"$'\n'
          done

          delimiter="$(openssl rand -hex 8)"
          echo "summary<<${delimiter}" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"
      - name: Get flake.lock diff
        if: steps.check.outputs.needs_update != ''
        id: diff
        run: |
          delimiter="$(openssl rand -hex 8)"
          echo "content<<${delimiter}" >> "$GITHUB_OUTPUT"
          git diff flake.lock >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"
      - name: Determine PR title
        if: steps.check.outputs.needs_update != ''
        id: pr
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          if [ "$TARGET" = "all" ]; then
            echo "title=chore(flake): update flake inputs" >> "$GITHUB_OUTPUT"
          else
            echo "title=chore(flake): update $TARGET" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub App token
        if: steps.check.outputs.needs_update != ''
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ vars.PULL_REQUEST_APP_ID }}
          private-key: ${{ secrets.PULL_REQUEST_APP_PRIVATE_KEY }}
      - name: Create Pull Request
        if: steps.check.outputs.needs_update != ''
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: "${{ steps.pr.outputs.title }}"
          title: "${{ steps.pr.outputs.title }}"
          body: |
            ## Updated inputs

            ${{ steps.update.outputs.summary }}
            <details>
            <summary>flake.lock diff</summary>

            ```diff
            ${{ steps.diff.outputs.content }}
            ```

            </details>
          labels: |
            dependencies
            nix
