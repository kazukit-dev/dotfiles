name: Build nix
on:
  push:
    branches: ["main"]
    paths:
      - '**.nix'
      - flake.lock
      - .github/workflows/build-nix.yml
      - .github/actions/setup-nix/**
jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-nix
        with:
          cachixAuthToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: false
      - name: Build devshell
        run: nix develop --show-trace -c true
      - name: Build nix-darwin and home-manager configurations
        run: nix build --show-trace --no-link .#darwinConfigurations.gabi.system
      - name: Print disk usage
        run: df -h
