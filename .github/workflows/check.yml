name: Check
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          skipPush: true
      - name: Run formatter
        run: nix fmt -- --ci
      - name: Run linter
        run: nix flake check --show-trace
