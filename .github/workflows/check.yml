name: Check
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          skipPush: true
      - name: Run formatter
        run: nix fmt -- --ci
      - name: Run linter
        run: nix flake check --show-trace
