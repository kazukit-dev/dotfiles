[keys]
prefix = "ctrl+j"

goto = "prefix+g"
split_horizontal = "prefix+minus"
split_vertical = ["prefix+v", "prefix+|"]
next_tab = "prefix+shift+l"
previous_tab = "prefix+shift+h"
next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"

[theme]
name = 'kanagawa'

# Kanagawa Dragon palette (rebelot/kanagawa.nvim)
[theme.custom]
panel_bg = "#181616"    # dragonBlack3 - main background
surface0 = "#282727"    # dragonBlack4 - elevated surface
surface1 = "#393836"    # dragonBlack5 - higher surface
surface_dim = "#12120f" # dragonBlack1 - dimmed inset
overlay0 = "#625e5a"    # dragonBlack6 - muted / borders
overlay1 = "#737c73"    # dragonAsh - muted foreground
text = "#c5c9c5"        # dragonWhite - primary foreground
subtext0 = "#a6a69c"    # dragonGray - secondary foreground
mauve = "#8992a7"       # dragonViolet
green = "#87a987"       # dragonGreen
yellow = "#c4b28a"      # dragonYellow
red = "#c4746e"         # dragonRed
blue = "#8ba4b0"        # dragonBlue2
teal = "#8ea4a2"        # dragonAqua
peach = "#b6927b"       # dragonOrange
accent = "#8ba4b0"      # dragonBlue2 - accent
