customCommands:
  - key: <c-g>
    context: files
    loadingText: Generating commit message...
    description: Generate commit message with AI
    output: terminal
    command: |-
      msg=$(
        git diff --cached |
        claude \
          --model haiku \
          --output-format text \
          --no-session-persistence \
          --print "Generate a conventional commit message for this diff.
              Output ONLY the commit message, nothing else.

              Format:
              <type>[optional scope]: <description>

              [optional body with bullet points]

              Types: feat, fix, docs, style, refactor, perf, test, chore
              Scope: functional area (e.g. config, api, ui, cli, deps)

              Rules:
              - Use present tense, imperative mood
              - Keep subject under 100 characters
              - Body explains what and why, not how
              - Do NOT wrap the output in backticks or code blocks"
      ) &&
      git commit -e -m "$msg"
gui:
  nerdFontsVersion: "3"
  theme:
    selectedLineBgColor:
      - "#2D4F67"
